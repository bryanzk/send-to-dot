# One-click Cloudflare deployment ("Deploy to Cloudflare" button). The Mac install ignores this file.
# Free Workers plan. The owner code (APPROVAL_SECRET) is asked for during deployment; the address
# is bound on the owner's first visit to /setup. See docs/CLOUDFLARE_DEPLOYMENT.md.
name = "send-to-dot"
main = "cloud/worker.mjs"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[build]
command = "node cloud/build-assets.mjs"

[vars]
# ORIGIN is deliberately absent: the owner's first /setup binds the address.
REDIRECTS = '["https://chatgpt.com/connector_platform_oauth_redirect"]'

[[durable_objects.bindings]]
name = "INBOX"
class_name = "InboxObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InboxObject"]
